name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Image Xcode 27 de GitHub (preview publique, runners arm64 uniquement)
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compiler avec Xcode 27 (sans signature)
        run: |
          if [ -d /Applications/Xcode_27.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app
          fi
          xcodebuild -version
          set -o pipefail
          xcodebuild build \
            -project AlarmTest.xcodeproj \
            -scheme AlarmTest \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""